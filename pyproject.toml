[project]
name = "memora"
version = "0.1.0"
description = "Trust-first memory engine for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
# only needed to re-run the Phase-0 spikes: uv sync --group spikes
spikes = ["sentence-transformers>=3", "psycopg[binary]>=3", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
