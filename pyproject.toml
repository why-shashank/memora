[project]
name = "memora"
version = "0.1.0"
description = "Trust-first memory engine for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.116.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "sentence-transformers>=3",
    "testcontainers[postgres]>=4.14.2",
]
# only needed to re-run the Phase-0 spikes: uv sync --group spikes
spikes = ["sentence-transformers>=3", "psycopg[binary]>=3", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# defaults (E4/E7/E9, F) + import sorting, bugbear, pyupgrade
extend-select = ["I", "B", "UP"]

[tool.mypy]
packages = ["memora"]
strict = true

[[tool.mypy.overrides]]
# pgvector ships no type stubs / py.typed marker
module = "pgvector.*"
ignore_missing_imports = true
