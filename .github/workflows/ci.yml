# Mirrors the local gates exactly: ruff check, ruff format, mypy, pytest.
# testcontainers spins up the pgvector Postgres inside the runner's docker daemon.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy memora
      - run: uv run pytest -q
