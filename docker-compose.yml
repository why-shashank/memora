# memora self-host stack — `docker compose up` from the repo root is the product.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: memora # dev default — override before exposing anything
      POSTGRES_DB: memora
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # exposed so local dev tooling (psql, api run outside docker) can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      MEMORA_DATABASE_URL: postgresql+asyncpg://memora:memora@postgres:5432/memora
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # readiness, not liveness: /healthz answers 200 only when the api can reach the DB
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: python -m memora.worker
    environment:
      MEMORA_DATABASE_URL: postgresql+asyncpg://memora:memora@postgres:5432/memora
      # BYO key from .env (compose reads it for ${...} substitution); the worker
      # fails fast at boot without one — extraction needs an LLM
      MEMORA_ANTHROPIC_API_KEY: ${MEMORA_ANTHROPIC_API_KEY:-}
    depends_on:
      # api boot runs migrations; healthy api ⇒ schema (incl. extraction_jobs) is at head
      api:
        condition: service_healthy

volumes:
  pgdata:
